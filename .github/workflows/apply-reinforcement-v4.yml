name: Apply FilmMate reinforcement v4

on:
  push:
    branches: [reinforcement-v4]
    paths:
      - '.filmmate/apply_reinforcement_v4.py'
      - '.github/workflows/apply-reinforcement-v4.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reinforcement-v4
          fetch-depth: 0
      - name: Apply verified production-state integration
        run: |
          python3 .filmmate/apply_reinforcement_v4.py
          rm -f .filmmate/apply_reinforcement_v4.py
          rm -f .github/workflows/apply-reinforcement-v4.yml
      - name: Run Node regression tests
        run: node --test desktop/*.test.cjs
      - name: Run Python regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify syntax
        run: |
          node --check desktop/main.cjs
          node --check desktop/production-state.cjs
          python3 -m py_compile core/hap_core.py
      - name: Commit applied reinforcement
        run: |
          git config user.name "FilmMate CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add production readiness and dependency diagnostics"
          git push origin HEAD:reinforcement-v4

name: Apply FilmMate reinforcement v7

on:
  push:
    branches: [reinforcement-v7]
    paths:
      - '.github/workflows/apply-reinforcement-v7.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reinforcement-v7
          fetch-depth: 0
      - name: Apply Production Agent desktop UI
        run: |
          python3 .filmmate/apply_reinforcement_v7.py
          rm -f .filmmate/apply_reinforcement_v7.py
          rm -f .github/workflows/apply-reinforcement-v7.yml
      - name: Run Python regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Run Node regression tests
        run: |
          for test in desktop/*.test.cjs; do
            echo "==> $test"
            node "$test"
          done
      - name: Verify syntax
        run: |
          python3 -m py_compile core/production_agent_bridge.py core/production_orchestrator.py core/production_commands.py mcp_server.py
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/python-bridge.cjs
      - name: Verify UI contract
        run: |
          grep -q 'id="agentGoal"' desktop/index.html
          grep -q 'runProductionAgent' desktop/preload.cjs
          grep -q 'production-agent:run' desktop/main.cjs
          grep -q 'runProductionAgentAsync' desktop/python-bridge.cjs
          grep -q 'checkpoint_changed' desktop/index.html
      - name: Commit applied reinforcement
        run: |
          git config user.name "FilmMate CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add Production Agent command UI"
          git push origin HEAD:reinforcement-v7

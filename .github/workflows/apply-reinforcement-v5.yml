name: Apply FilmMate reinforcement v5

on:
  push:
    branches: [reinforcement-v5]
    paths:
      - '.filmmate/apply_reinforcement_v5.py'
      - '.filmmate/harden_reinforcement_v5.py'
      - '.github/workflows/apply-reinforcement-v5.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reinforcement-v5
          fetch-depth: 0
      - name: Apply semantic MCP integration
        run: |
          python3 .filmmate/apply_reinforcement_v5.py
          python3 .filmmate/harden_reinforcement_v5.py
          rm -f .filmmate/apply_reinforcement_v5.py
          rm -f .filmmate/harden_reinforcement_v5.py
          rm -f .github/workflows/apply-reinforcement-v5.yml
      - name: Verify semantic MCP tool registry
        run: |
          python3 - <<'PY'
          import mcp_server
          names = {tool['name'] for tool in mcp_server.TOOLS}
          required = {
              'prepare_scene',
              'get_generate_ready',
              'prepare_stale_regeneration',
              'save_production_object',
              'approve_production_object',
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f'missing semantic MCP tools: {missing}')
          print('semantic MCP tools:', ', '.join(sorted(required)))
          PY
      - name: Run Python regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Run Node regression tests
        run: node --test desktop/*.test.cjs
      - name: Verify syntax
        run: |
          python3 -m py_compile mcp_server.py core/production_commands.py core/hap_core.py
          node --check desktop/main.cjs
          node --check desktop/production-state.cjs
      - name: Commit applied reinforcement
        run: |
          git config user.name "FilmMate CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add semantic MCP production commands"
          git push origin HEAD:reinforcement-v5

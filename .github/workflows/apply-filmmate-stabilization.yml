name: Apply FilmMate stabilization

on:
  push:
    branches:
      - stabilization-v1-v2

permissions:
  contents: write

jobs:
  apply-stabilization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply main-process patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .filmmate/main-stabilization.patch
          git apply .filmmate/main-stabilization.patch

      - name: Run focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_validation_hardening tests.test_desktop_runtime
          node --test desktop/project-paths.test.cjs desktop/python-bridge.test.cjs

      - name: Commit stabilized source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .filmmate/main-stabilization.patch
          rm -f .github/workflows/apply-filmmate-stabilization.yml
          rmdir .filmmate 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize validation and desktop boundaries"
          git push origin HEAD:stabilization-v1-v2

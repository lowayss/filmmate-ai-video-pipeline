<div class="shell">
  <header>
    <div class="brand-block"><div class="brand">Film<span>Mate</span></div><small>AI FILM WORKSPACE</small></div>
    <div class="header-center"><label for="projectSelect">현재 프로젝트</label><select id="projectSelect" class="project-select" aria-label="현재 프로젝트"></select></div>
    <div class="actions"><input id="search" class="search" placeholder="씬 검색"><button id="refresh" class="btn icon-btn" title="프로젝트 새로고침" aria-label="프로젝트 새로고침">↻</button><details class="header-menu"><summary class="btn icon-btn" aria-label="프로젝트 메뉴">•••</summary><div class="header-menu-panel"><button id="deleteProject" class="menu-danger" disabled>현재 프로젝트를 휴지통으로 이동</button></div></details><button id="newProject" class="btn primary">+ 프로젝트</button></div>
  </header>
  <aside class="sidebar" id="nav"><div class="side-label">제작 관리</div><div class="nav active" data-view="board"><i>01</i><span>프로젝트 보드</span></div><div class="nav" data-view="assets"><i>02</i><span>에셋</span></div><div class="nav" data-view="storyboard"><i>03</i><span>스토리보드</span></div><div class="nav" data-view="ready"><i>04</i><span>AI 입력</span></div><div class="side-label">시스템</div><div class="nav" data-view="system"><i>✓</i><span>연결·검증</span><b class="nav-status"></b></div><div class="sidebar-foot"><span>FilmMate 0.7</span><small>양방향 리비전</small></div></aside>
  <main id="main"><div class="empty">프로젝트를 불러오는 중입니다.</div></main>
</div>
<div id="modalBg" class="modal-bg"><div class="modal"><h2>새 프로젝트</h2><p class="sub">전체 시나리오를 넣으면 씬을 자동으로 나눕니다.</p><label>프로젝트명</label><input id="projectTitle" placeholder="100배 줌"><label>전체 시나리오</label><textarea id="projectScript" placeholder="## S#1. 주택가 옥상 / 늦은 오후"></textarea><div class="modal-actions"><button id="cancel" class="btn">취소</button><button id="create" class="btn primary">프로젝트 생성</button></div></div></div>
<div id="lightbox" class="lightbox"><img id="lightboxImg" alt="미리보기"></div><div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stages={analysis:'분석',text_conti:'글 콘티',assets:'에셋',storyboard:'스토리보드',prompts:'프롬프트',qa:'QA'};
let projects=[],project=null,view='board',selected=null,detail=null,sceneTab='overview',seedanceSkillPolicy={status:'LOADING',name:'seedance-prompt-rules'},aiDraft={model:'Seedance 2.0',unitType:'shot',targetId:'C01',items:[],uploads:[],prompt:'',combinedStoryboard:null,skillBundleSha256:null};
let productionAgentState={goal:'',result:null,loading:false,error:null,checkpoint:null,run:null,runLoading:false,workerRunning:false,workerStatus:null};
let deletingProject=false;
const sceneId=s=>s.path.split('/scenes/').pop(),hasReplacement=v=>String(v??'').includes('�'),safeProjectTitle=p=>hasReplacement(p?.title)?`${p.id.replace(/^PROJECT_/,'')} · 원문 인코딩 오류`:p?.title||p?.id||'제목 없음',safeSceneTitle=s=>hasReplacement(s?.title)?`${s.scene_id} · 원문 인코딩 오류`:s?.title||s?.scene_id,statusClass=v=>['ready','accepted','verified','connected'].includes(v)?'done':v==='planned'?'plan':v==='stale'||v==='blocked'||v==='invalid'||v==='changed'||v==='missing'?'warn':'';
function chooseProject(list){const saved=localStorage.getItem('filmmate.project')||localStorage.getItem('filmmake.project');return list.find(p=>p.id===saved)||list.find(p=>!hasReplacement(p.title))||list[0]||null}
function syncProjectSelect(){const select=$('projectSelect');select.innerHTML=projects.map(p=>`<option value="${esc(p.id)}" ${project?.id===p.id?'selected':''}>${esc(safeProjectTitle(p))}</option>`).join('');select.disabled=!projects.length;$('deleteProject').disabled=!project}
async function load(){try{projects=await window.sceneFlow.projects();project=chooseProject(projects);if(project)localStorage.setItem('filmmate.project',project.id);selected=null;detail=null;syncProjectSelect();render()}catch(e){$('main').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}

function pageHead(name,sub){return `<div class="topline"><div><div class="eyebrow">${esc(safeProjectTitle(project))}</div><h1>${esc(name)}</h1><p class="sub">${esc(sub)}</p></div><div class="metrics"><div class="metric"><b>${project.scenes.length}</b><small>SCENES</small></div><div class="metric"><b>${project.scenes.reduce((n,s)=>n+(s.shot_count||0),0)}</b><small>CUTS</small></div></div></div>`}

function productionAgentCommandView(){

function agentRunLabel(state){return state==='READY'?'실행 가능':state==='PAUSED'?'일시정지':state==='WAITING_REVIEW'?'QA/검토 대기':state==='WAITING_WORK'?'진행 중 작업 대기':state==='BLOCKED'?'차단됨':state==='COMPLETE'?'완료':state==='CANCELLED'?'취소됨':state==='FAILED'?'실패':state||'대기'}
function productionAgentRunView(){const a=productionAgentState,run=a.run;if(!run)return `<div class="agent-run"><div class="agent-run-head"><div><strong>실행 큐</strong><small class="muted">계획을 HAP SQLite에 저장해 앱을 다시 열어도 이어갈 수 있습니다.</small></div><button class="btn" id="agentStartRun" ${a.runLoading?'disabled':''}>${a.runLoading?'생성 중…':'실행 큐 만들기'}</button></div></div>`;const tasks=(run.active_tasks||[]).slice(0,8),failed=(run.tasks||[]).find(x=>x.state==='FAILED'),terminal=['COMPLETE','CANCELLED'].includes(run.state);return `<div class="agent-run"><div class="agent-run-head"><div><strong>실행 큐 · ${esc(agentRunLabel(run.state))}</strong><small class="muted">${esc(run.run_id)} · checkpoint ${esc(String(run.checkpoint||'').slice(0,12))}</small></div><div class="agent-run-actions"><button class="btn" id="agentRefreshRun" ${a.runLoading?'disabled':''}>새로고침</button>${run.state==='READY'?`<button class="btn primary" id="agentAutoWorker" ${a.workerRunning?'disabled':''}>${a.workerRunning?'자동 실행 중…':'자동 실행'}</button>`:''}${a.workerRunning?'<button class="btn" id="agentStopWorker">Worker 중지</button>':''}${run.state==='PAUSED'?'<button class="btn" id="agentResumeRun">재개</button>':!terminal&&run.state!=='FAILED'?'<button class="btn" id="agentPauseRun">일시정지</button>':''}${failed?`<button class="btn" id="agentRetryRun" data-task="${esc(failed.task_id)}">실패 task 재시도</button>`:''}${!terminal?'<button class="btn danger" id="agentCancelRun">취소</button>':''}</div></div><div class="agent-step-list">${tasks.map(task=>`<div class="agent-task"><span>${task.order}</span><div><b>${esc(task.stage||'작업')}</b><small>${esc(task.instruction||task.suggested_tool||'정본 상태 확인')}</small></div><span class="agent-task-state ${esc(task.state)}">${esc(task.state)}</span></div>`).join('')||`<div class="muted">${run.state==='COMPLETE'?'목표가 정본 기준으로 완료되었습니다.':'현재 활성 task가 없습니다.'}</div>`}</div>${run.last_error?`<div class="agent-error">${esc(run.last_error)}</div>`:''}</div>`}
async function startProductionAgentRun(){const goal=String(productionAgentState.goal||productionAgentState.result?.goal||'영상 생성 준비 완료까지 진행해줘').trim();productionAgentState.runLoading=true;renderScene();try{const run=await window.sceneFlow.startProductionRun(selected.project,sceneId(selected),{goal,target:productionAgentState.result?.target});productionAgentState.run=run;productionAgentState.result=run?.production_plan||productionAgentState.result;productionAgentState.checkpoint=run?.checkpoint||productionAgentState.checkpoint;productionAgentState.runLoading=false;renderScene();toast('Production Agent 실행 큐를 만들었습니다')}catch(e){productionAgentState.runLoading=false;productionAgentState.error=e.message||String(e);renderScene();toast('실행 큐 생성 실패: '+(e.message||e))}}

async function loadLatestProductionAgentRun(){try{const run=await window.sceneFlow.getProductionRun(selected.project,sceneId(selected),null);if(!selected)return;productionAgentState.run=run;productionAgentState.result=run?.production_plan||productionAgentState.result;productionAgentState.checkpoint=run?.checkpoint||productionAgentState.checkpoint;renderScene()}catch(e){/* no previous run is a valid state */}}

async function handleProductionAgentWorkerEvent(event){if(!event||event.run_id!==productionAgentState.run?.run_id)return;productionAgentState.workerStatus=event.type==='claimed'?`${event.stage||'작업'} 실행 중`:event.type==='proposal_ready'?'Semantic action 검증 중':event.type==='applied'?'HAP 재검증 중':event.reason||event.type;productionAgentState.workerRunning=!['stopped','completed','failed','cancelled'].includes(event.type);if(['applied','stopped','completed','failed','cancelled'].includes(event.type)){try{await refreshProductionAgentRun()}catch{/* status UI is best effort */}}else if(selected){renderScene()}if(event.type==='completed')toast('Production Agent 목표가 정본 기준으로 완료되었습니다');if(event.type==='stopped'&&event.reason==='needs_user_input')toast('자동 실행 중지 · 사용자 입력 또는 외부 생성이 필요합니다');if(event.type==='failed')toast('Production Agent Worker 실패: '+(event.error||'오류'))}
async function runProductionAgentGoal(goal){
  const value=String(goal??productionAgentState.goal??'').trim();if(!value){toast('Production Agent에게 목표를 입력하세요');return}

  try{
    const result=await window.sceneFlow.runProductionAgent(selected.project,sceneId(selected),{goal:value,previous_checkpoint:productionAgentState.checkpoint});
    productionAgentState.result=result;productionAgentState.checkpoint=result?.checkpoint||productionAgentState.checkpoint;productionAgentState.loading=false;
    detail=await window.sceneFlow.sceneDetail(selected.project,sceneId(selected));if(detail?.production)selected.production=detail.production;renderScene();
  }catch(e){productionAgentState.loading=false;productionAgentState.error=e.message||String(e);renderScene();toast('Production Agent 실패: '+(e.message||e))}
}
function bindProductionAgent(){

}

  push('PROMPT_REFERENCES','프롬프트–에셋 매핑',refMap,referenceMode?'@Image 순서·파일명 일치':'텍스트 모드 · @Image 없음','선택 에셋과 @Image 표기가 불일치');
  const chunk=prompt.includes(`CUT ${id}`)?prompt.slice(prompt.indexOf(`CUT ${id}`)):'';
  push('PROMPT_CUT','컷 사건',Boolean(chunk),`CUT ${id} 있음`,`CUT ${id} 누락`);
  push('ONE_ACTION_CAMERA','중심 행동·카메라',(chunk.match(/\n중심 행동:/g)||[]).length===1&&(chunk.match(/\n카메라:/g)||[]).length===1,'행동 1개·카메라 1개','행동·카메라 구조 누락 또는 과밀');
  const dialogue=shot?.audio?.dialogue&&shot.audio.dialogue!=='none'?shot.audio.dialogue:null,sound=shot?.audio?.sound&&shot.audio.sound!=='none'?shot.audio.sound:null;
  push('DIALOGUE_BRACES','대사 원문 잠금',!dialogue||prompt.includes(`{${dialogue}}`),dialogue?'{ } 원문 보존':'대사 없음','{ } 대사 원문 누락');
  push('SHOT_LOCAL_AUDIO','샷 로컬 사운드',!sound||prompt.includes(`<${sound}>`),sound?'< > 사운드 보존':'사운드 미지정','< > 사운드 누락');
  const performance=chunk.includes('표정·연기(관찰 가능한 지시):')&&chunk.includes('회복 상태:')&&prompt.includes('자동 미소')&&prompt.includes('기계적인 립싱크');
  push('PERFORMANCE_GUARD','관찰 가능한 연기·FACS',performance,'선행 반응·회복·AI 연기 억제 있음','연기 또는 AI 표정·립싱크 억제 누락');
  push('PERFORMANCE_COMPILE','내부 연기 카드 변환',!/^(?:행동 목표|서브텍스트|트리거|표면 전술):/m.test(prompt),'추상 필드가 화면 행동으로 변환됨','내부 연기 필드가 최종 프롬프트에 노출됨');
  push('LIVE_ACTION_COLOR','실사 컬러 조건',!seedanceIsLiveAction()||(prompt.includes('— 실사 컬러 베이스 —')&&prompt.includes('절제된 자연 채도')),seedanceIsLiveAction()?'실사 플레이트에만 중립 컬러 베이스 적용':'실사 아님','실사 컬러 베이스 누락');
  const status=checks.some(x=>x.status==='FAIL')?'FAIL':checks.some(x=>x.status==='WARN')?'WARN':'PASS';
  return{schema_version:1,preview:true,canonical:false,status,target_id:id,model:aiDraft.model,skill_provenance:seedanceSkillProvenance(),checked_at:new Date().toISOString(),counts:{pass:checks.filter(x=>x.status==='PASS').length,warn:checks.filter(x=>x.status==='WARN').length,fail:checks.filter(x=>x.status==='FAIL').length},checks};
}
function currentPromptQa(){return aiDraft.unitType==='block'?scanSeedanceBlock():scanSingleShotPrompt()}
function directionSheetView(){
  const sheet=productionDirectionSheet();
  return `<section class="direction-card"><div class="direction-head"><div><strong>제작 기준서</strong><small>콘티에서 생성된 작업 계약 · HAP 정본 미변경</small></div><button class="btn" id="copyDirectionSheet">복사</button></div><div class="direction-grid">${sheet.rows.slice(0,4).map(([label,value])=>`<div class="direction-item"><b>${esc(label)}</b><span>${esc(value)}</span></div>`).join('')}</div><details class="direction-more"><summary>연기·컬러·금지 포함 전체 기준서 보기</summary><pre>${esc(sheet.markdown)}</pre></details></section>`;
}
function gateRows(checks){return checks.map(x=>`<div class="gate-row ${x.status.toLowerCase()}"><span class="gate-mark">${x.status==='PASS'?'✓':x.status==='WARN'?'!':'×'}</span><b>${esc(x.label)}</b><span>${esc(x.detail)}</span></div>`).join('')}
function seedanceSkillBindingView(){const ready=seedanceSkillReady(),failed=(seedanceSkillPolicy?.rule_checks||[]).filter(x=>x.status!=='PASS').length,detail=ready?`필수 파일 ${seedanceSkillPolicy.loaded_file_count}/${seedanceSkillPolicy.required_file_count} · 규칙 ${seedanceSkillPolicy.rule_checks?.length||0}개 검사 통과`:`누락 ${seedanceSkillPolicy?.missing_files?.length||0} · 규칙 실패 ${failed}`;return `<section class="skill-lock ${ready?'':'blocked'}"><div><strong>${ready?'씨댄스 스킬 강제 적용':'SKILL_GATE_BLOCKED'}</strong><small>FilmMate의 모든 영상 프롬프트 · ${esc(detail)}</small></div><div class="row">${ready?`<span class="skill-hash">#${esc(seedanceSkillPolicy.short_hash)}</span>`:''}<button class="btn" id="reloadSeedanceSkill">스킬 새로고침</button></div></section>`}
function blockGateView(){
  const qa=currentPromptQa(),issues=qa.checks.filter(x=>x.status!=='PASS'),summary=qa.status==='PASS'?`${qa.counts.pass}개 항목 통과`:`실패 ${qa.counts.fail} · 경고 ${qa.counts.warn}`,label=aiDraft.unitType==='block'?'블록 검사':'컷 프롬프트 검사';
  return `<section class="block-gate"><div class="gate-head"><div><strong>${label}</strong><small>복사·저장 전 스킬 원본·정본·에셋·프롬프트 자동 검사</small></div><div class="row"><span class="gate-badge ${qa.status.toLowerCase()}">${qa.status} · ${summary}</span><button class="btn" id="rerunBlockScan">다시 검사</button></div></div>${issues.length?`<div class="gate-issues">${gateRows(issues)}</div>`:'<div class="gate-issues"><div class="gate-row pass"><span class="gate-mark">✓</span><b>복사·저장 가능</b><span>seedance-prompt-rules와 현재 정본을 기준으로 실패 없음.</span></div></div>'}<details class="gate-details"><summary>전체 ${qa.checks.length}개 항목 보기</summary><div class="gate-issues">${gateRows(qa.checks)}</div></details></section>`;
}
const promptLibraryViewBeforeDirectionGate=promptLibraryView;
promptLibraryView=(canonical)=>{
  let html=promptLibraryViewBeforeDirectionGate(canonical);
  html=html.replace('<section class="slot">',`${seedanceSkillBindingView()}${directionSheetView()}${blockGateView()}<section class="slot">`);
  if(!seedanceSkillReady())html=html.replace('<textarea id="aiPrompt"','<textarea id="aiPrompt" disabled');
  return html;
};
function promptCharacterMetrics(text=aiDraft.prompt){const value=String(text??'');return{total:Array.from(value).length,withoutWhitespace:Array.from(value.replace(/\s/gu,'')).length}}
function promptCharacterCountText(text=aiDraft.prompt){const count=promptCharacterMetrics(text);return `글자수 ${count.total.toLocaleString('ko-KR')}자 · 공백 제외 ${count.withoutWhitespace.toLocaleString('ko-KR')}자`}
function updatePromptCharacterCount(text=aiDraft.prompt){const counter=$('promptCharCount');if(counter)counter.textContent=promptCharacterCountText(text)}
const promptLibraryViewBeforeCharacterCount=promptLibraryView;
promptLibraryView=(canonical)=>{
  const html=promptLibraryViewBeforeCharacterCount(canonical);
  return html.replace('</span></div><div class="field"><textarea id="aiPrompt"',` · <strong id="promptCharCount" class="prompt-count" aria-live="polite">${promptCharacterCountText()}</strong></span></div><div class="field"><textarea id="aiPrompt"`);
};
function buildGatedUploadPackConfig(){
  const snapshot={model:aiDraft.model,unitType:aiDraft.unitType,targetId:aiDraft.targetId,items:[...(aiDraft.items||[])],uploads:[...(aiDraft.uploads||[])],prompt:aiDraft.prompt,combinedStoryboard:aiDraft.combinedStoryboard};
  const payload=aiBlocks().map(block=>{
    aiDraft.model=snapshot.model;aiDraft.unitType='block';aiDraft.targetId=block.block_id||block.id;aiDraft.items=uploadPackItems(block);aiDraft.combinedStoryboard=null;
    const prompt=buildAiPrompt(),items=packageDisplayItems(),qa=scanSeedanceBlock(block,prompt,items),productionContract=productionDirectionSheet(block);
    return{blockId:aiDraft.targetId,durationSec:block.duration_sec,shotIds:block.shot_ids||block.cut_ids||[],prompt,items:[...items],qa,productionContract,skillProvenance:seedanceSkillProvenance()};
  });
  aiDraft.model=snapshot.model;aiDraft.unitType=snapshot.unitType;aiDraft.targetId=snapshot.targetId;aiDraft.items=snapshot.items;aiDraft.uploads=snapshot.uploads;aiDraft.combinedStoryboard=snapshot.combinedStoryboard;aiDraft.prompt=snapshot.prompt||buildAiPrompt();
  return{model:snapshot.model,blocks:payload,skillProvenance:seedanceSkillProvenance(),qa:{status:payload.some(x=>x.qa.status==='FAIL')?'FAIL':payload.some(x=>x.qa.status==='WARN')?'WARN':'PASS',blocks:payload.map(x=>({block_id:x.blockId,status:x.qa.status,counts:x.qa.counts}))}};
}
buildUploadPackConfig=buildGatedUploadPackConfig;
const bindAiControlsBeforeDirectionGate=bindAiControls;
bindAiControls=()=>{
  bindAiControlsBeforeDirectionGate();
  const reloadSkill=$('reloadSeedanceSkill');if(reloadSkill)reloadSkill.onclick=async()=>{seedanceSkillPolicy=await loadSeedanceSkillPolicy();aiDraft.prompt=buildAiPrompt();renderScene();toast(seedanceSkillReady()?`씨댄스 스킬 #${seedanceSkillPolicy.short_hash} 재적용`:'SKILL_GATE_BLOCKED · 스킬 원본 점검 필요')};
  const copy=$('copyDirectionSheet');if(copy)copy.onclick=async()=>{await navigator.clipboard.writeText(productionDirectionSheet().markdown);toast('제작 기준서를 복사했습니다')};
  const rerun=$('rerunBlockScan');if(rerun)rerun.onclick=()=>{const prompt=$('aiPrompt');if(prompt)aiDraft.prompt=prompt.value;const qa=currentPromptQa();renderScene();toast(qa.status==='PASS'?'프롬프트 검사 통과':`프롬프트 검사 ${qa.status} · 실패 ${qa.counts.fail} · 경고 ${qa.counts.warn}`)};
  const copyPrompt=$('copyPrompt');if(copyPrompt)copyPrompt.onclick=async()=>{const prompt=$('aiPrompt');if(prompt)aiDraft.prompt=prompt.value;const qa=currentPromptQa(),first=qa.checks.find(x=>x.status==='FAIL');if(qa.status==='FAIL'){toast(`복사 차단 · ${first?.label}: ${first?.detail}`);return}await navigator.clipboard.writeText(aiDraft.prompt);toast(`seedance-prompt-rules #${seedanceSkillPolicy.short_hash} 통과 · 프롬프트 복사`)};
  const save=$('saveBlockLibrary');if(save)save.onclick=async()=>{
    if(aiDraft.unitType!=='block'){toast(`${modelBlockDurationSec()}초 블록을 먼저 선택하세요`);return}
    const prompt=$('aiPrompt');if(prompt)aiDraft.prompt=prompt.value;
    const items=packageDisplayItems(),qa=scanSeedanceBlock(activeAiBlock(),aiDraft.prompt,items);
    if(qa.status==='FAIL'){const first=qa.checks.find(x=>x.status==='FAIL');toast(`저장 차단 · ${first?.label||'블록 검사'}: ${first?.detail||'오류'}`);return}
    try{const out=await window.sceneFlow.saveBlockLibrary(selected.project,sceneId(selected),{...aiDraft,items,shotIds:currentShotIds(),conhapDir:activeConhapDir(),qa,productionContract:productionDirectionSheet(),skillProvenance:seedanceSkillProvenance()});toast(`블록 라이브러리 v${String(out.version).padStart(3,'0')} 저장·열기 완료`)}catch(e){toast('블록 라이브러리 저장 실패: '+e.message)}
  };
  const savePack=$('saveUploadPack');if(savePack)savePack.onclick=async()=>{
    const config=buildGatedUploadPackConfig(),failed=config.blocks.filter(x=>x.qa.status==='FAIL');
    if(failed.length){toast(`전체 묶음 차단 · ${failed.map(x=>x.blockId).join(', ')} 검사 실패`);return}
    try{const out=await window.sceneFlow.saveUploadPack(selected.project,sceneId(selected),config);toast(`${out.blockCount}개 블록·${out.imageCount}개 이미지·검사 보고서를 저장했습니다`)}catch(e){toast('업로드 묶음 생성 실패: '+e.message)}
  };
  const legacyExport=$('exportPackage');if(legacyExport)legacyExport.onclick=async()=>{const prompt=$('aiPrompt');if(prompt)aiDraft.prompt=prompt.value;const qa=currentPromptQa(),first=qa.checks.find(x=>x.status==='FAIL');if(qa.status==='FAIL'){toast(`프리뷰 차단 · ${first?.label}: ${first?.detail}`);return}try{const out=await window.sceneFlow.exportAiPackage(selected.project,sceneId(selected),{...aiDraft,items:packageDisplayItems(),shotIds:currentShotIds(),qa,skillProvenance:seedanceSkillProvenance()});toast(`${aiDraft.unitType==='block'?'블록':'컷'} 패키지 v${String(out.version).padStart(3,'0')} 생성 완료`)}catch(e){toast('패키지 생성 실패: '+e.message)}};
};
const bindAiControlsBeforeCharacterCount=bindAiControls;
bindAiControls=()=>{
  bindAiControlsBeforeCharacterCount();
  const prompt=$('aiPrompt');
  if(prompt){prompt.addEventListener('input',()=>updatePromptCharacterCount(prompt.value));updatePromptCharacterCount(prompt.value)}
};

name: Apply FilmMate reinforcement v9

on:
  push:
    branches: [reinforcement-v9]
    paths:
      - ".filmmate/apply_reinforcement_v9.py"
      - ".github/workflows/apply-reinforcement-v9.yml"
      - "core/production_agent_execution.py"
      - "core/production_agent_bridge.py"
      - "desktop/production-agent-worker.cjs"
      - "desktop/production-agent-action.schema.json"
      - "desktop/preload.cjs"
      - "desktop/package.json"
      - "tests/test_production_agent_execution.py"
      - "desktop/production-agent-worker.test.cjs"

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reinforcement-v9
          fetch-depth: 0

      - name: Apply Execution Worker integration
        run: python3 .filmmate/apply_reinforcement_v9.py

      - name: Verify Production Agent MCP worker boundary
        run: |
          python3 - <<'PY'
          import mcp_server
          names = {tool["name"] for tool in mcp_server.TOOLS}
          required = {
              "start_production_run",
              "claim_production_work_order",
              "submit_production_work_proposal",
              "control_production_run",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"missing worker tools: {missing}")
          forbidden = {"approve_production_object", "approve_hap_revision"}
          from core import production_agent_execution
          if forbidden & production_agent_execution.AUTO_TOOLS:
              raise SystemExit("approval tool entered worker allowlist")
          print("Production Agent worker MCP boundary: PASS")
          PY

      - name: Run Python regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Run Node regression tests
        run: node --test desktop/*.test.cjs

      - name: Verify syntax
        run: |
          python3 -m py_compile core/production_agent_execution.py core/production_agent_jobs.py core/production_agent_bridge.py mcp_server.py
          node --check desktop/production-agent-worker.cjs
          node --check desktop/main.cjs
          node --check desktop/preload.cjs

      - name: Verify execution safety contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from core import production_agent_execution
          worker = Path("desktop/production-agent-worker.cjs").read_text(encoding="utf-8")
          main = Path("desktop/main.cjs").read_text(encoding="utf-8")
          ui = Path("desktop/index.html").read_text(encoding="utf-8")
          schema = json.loads(Path("desktop/production-agent-action.schema.json").read_text(encoding="utf-8"))
          assert "'--sandbox', 'read-only'" in worker
          assert "workspace-write" not in worker
          assert "apply_worker_proposal" in worker
          assert "claim_work_order" in worker
          assert "production-agent:start-worker" in main
          assert "자동 실행" in ui
          assert "approve_production_object" not in production_agent_execution.AUTO_TOOLS
          assert "approve_hap_revision" not in schema["properties"]["tool"]["enum"]
          print("Execution Worker safety contract: PASS")
          PY

      - name: Commit applied reinforcement
        run: |
          rm -f .filmmate/apply_reinforcement_v9.py
          rm -f .github/workflows/apply-reinforcement-v9.yml
          git config user.name "FilmMate CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add guarded Production Agent execution worker"
          git push origin reinforcement-v9

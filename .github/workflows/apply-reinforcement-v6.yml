name: Apply FilmMate reinforcement v6

on:
  push:
    branches: [reinforcement-v6]

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reinforcement-v6
          fetch-depth: 0

      - name: Apply Production Agent integration
        run: |
          python3 .filmmate/apply_reinforcement_v6.py
          rm -f .filmmate/apply_reinforcement_v6.py
          rm -f .github/workflows/apply-reinforcement-v6.yml

      - name: Verify Production Agent MCP registry
        run: |
          python3 - <<'PY'
          import mcp_server
          from core import production_orchestrator
          names = {tool['name'] for tool in mcp_server.TOOLS}
          if 'run_production_agent' not in names:
              raise SystemExit('run_production_agent missing from MCP registry')
          if production_orchestrator.infer_target('영상 생성 준비 완료 상태까지 만들어줘') != 'generate_ready':
              raise SystemExit('Korean generate-ready goal inference failed')
          if production_orchestrator.infer_target('업로드 패키지까지 준비해줘') != 'handoff_ready':
              raise SystemExit('Korean handoff goal inference failed')
          print('Production Agent registry and goal inference OK')
          PY

      - name: Run Python regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Run Node regression tests
        run: node --test desktop/*.test.cjs

      - name: Verify syntax
        run: |
          python3 -m py_compile mcp_server.py core/production_commands.py core/production_orchestrator.py
          node --check desktop/main.cjs

      - name: Commit applied reinforcement
        run: |
          git config user.name "FilmMate CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Production Agent orchestration"
            git push origin HEAD:reinforcement-v6
          fi

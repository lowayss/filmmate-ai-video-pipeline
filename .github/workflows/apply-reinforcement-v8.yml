name: Apply FilmMate reinforcement v8

on:
  push:
    branches: [reinforcement-v8]
    paths:
      - ".filmmate/apply_reinforcement_v8.py"
      - ".filmmate/fix_reinforcement_v8_contract.py"
      - ".github/workflows/apply-reinforcement-v8.yml"
      - "core/production_agent_jobs.py"
      - "core/production_agent_bridge.py"
      - "tests/test_production_agent_jobs.py"
      - "tests/test_production_agent_runtime_contract.py"

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reinforcement-v8
          fetch-depth: 0

      - name: Apply durable Production Agent queue
        run: |
          python3 .filmmate/apply_reinforcement_v8.py
          python3 .filmmate/fix_reinforcement_v8_contract.py

      - name: Verify Production Agent MCP registry
        run: |
          python3 - <<'PY'
          import mcp_server
          names = {tool["name"] for tool in mcp_server.TOOLS}
          required = {
              "run_production_agent",
              "start_production_run",
              "get_production_run",
              "claim_production_task",
              "control_production_run",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"missing Production Agent tools: {missing}")
          print("Production Agent tools:", ", ".join(sorted(required)))
          PY

      - name: Run Python regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Run Node regression tests
        run: node --test desktop/*.test.cjs

      - name: Verify syntax
        run: |
          python3 -m py_compile core/production_agent_jobs.py core/production_agent_bridge.py core/production_orchestrator.py mcp_server.py
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/python-bridge.cjs

      - name: Verify queue safety contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          queue = Path("core/production_agent_jobs.py").read_text(encoding="utf-8")
          main = Path("desktop/main.cjs").read_text(encoding="utf-8")
          ui = Path("desktop/index.html").read_text(encoding="utf-8")
          assert "task_resolved_from_canonical_state" in queue
          assert "E_PRODUCTION_AGENT_TASK_ALREADY_CLAIMED" in queue
          assert "retry_task" in queue
          assert "previous_checkpoint" in main
          assert "실행 큐 만들기" in ui
          assert "mark_task_complete" not in queue
          print("durable queue safety contract: PASS")
          PY

      - name: Commit applied reinforcement
        run: |
          rm -f .filmmate/apply_reinforcement_v8.py
          rm -f .filmmate/fix_reinforcement_v8_contract.py
          rm -f .github/workflows/apply-reinforcement-v8.yml
          git config user.name "FilmMate CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add durable Production Agent execution queue"
          git push origin reinforcement-v8

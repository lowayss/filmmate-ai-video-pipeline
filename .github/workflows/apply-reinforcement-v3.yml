name: Apply FilmMate reinforcement v3

on:
  push:
    branches: [reinforcement-v3]
    paths:
      - '.filmmate/apply_reinforcement_v3.py'
      - '.github/workflows/apply-reinforcement-v3.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reinforcement-v3
          fetch-depth: 0
      - name: Apply verified desktop async changes
        run: |
          python3 .filmmate/apply_reinforcement_v3.py
          rm -f .filmmate/apply_reinforcement_v3.py
          rm -f .filmmate/reinforcement-v3.patch
          rm -f .github/workflows/apply-reinforcement-v3.yml
      - name: Run Node regression tests
        run: node --test desktop/*.test.cjs
      - name: Run Python regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify Electron main syntax
        run: node --check desktop/main.cjs
      - name: Commit applied reinforcement
        run: |
          git config user.name "FilmMate CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Make desktop Python operations asynchronous"
          git push origin HEAD:reinforcement-v3
